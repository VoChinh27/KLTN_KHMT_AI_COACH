[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coach-gym"
dynamic = ["version"]
description = "Auditable foundations for single-camera Gym movement analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "opencv-contrib-python==5.0.0.93",
    "mediapipe==0.10.14",
    "numpy==2.4.6",
    "scipy==1.17.1",
]

[project.scripts]
gym-video-info = "gym_coach.video.cli:main"
gym-pose-extract = "gym_coach.pose.cli:main"
gym-quality-audit = "gym_coach.quality.cli:main"
gym-pose-preprocess = "gym_coach.preprocessing.cli:main"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
count-research = ["torch==2.14.0"]

[tool.setuptools.dynamic]
version = {attr = "gym_coach._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gym_coach*"]

[tool.setuptools.package-data]
gym_coach = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: checks against an actual project data file",
]

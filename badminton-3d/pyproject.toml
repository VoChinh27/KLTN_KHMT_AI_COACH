[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton3d"
version = "1.3.0"
description = "Chấm điểm tư thế cầu lông (ready / serve) bằng MediaPipe 3D: chuẩn từ HLV + so khớp từng góc (angle-by-angle)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "pandas>=1.5", "scipy>=1.9", "pyyaml>=6.0", "opencv-python>=4.7", "matplotlib>=3.6", "mediapipe>=0.10", "pillow>=9.0"]

[project.scripts]
badminton3d = "badminton3d.cli:main"

[tool.setuptools.packages.find]
include = ["badminton3d*"]

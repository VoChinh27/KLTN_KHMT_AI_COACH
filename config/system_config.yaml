# config/system_config.yaml
# ------------------------------------------------------------------
# Cấu hình toàn hệ thống (không đổi theo môn thể thao). Đọc bởi
# core/pipeline.py khi khởi tạo — xem Pipeline.from_config().
# ------------------------------------------------------------------

# Backend pose estimation:
#   - "rtmpose"   : RTMPose-m (ONNX Runtime) + YOLO/ByteTrack — khuyến nghị,
#                   chính xác cao, xử lý occlusion tốt, tracking ổn định,
#                   không cần mmcv/mmpose/mmdet. Xem stage2_pose/pose_extractor.py.
#   - "mediapipe" : BlazePose 33 điểm (có heel/foot_index).
#   - "yolo"      : YOLO-Pose 17 điểm COCO (nhanh, multi-person sẵn).
pose_backend: rtmpose

# --- Cấu hình backend RTMPose (chỉ dùng khi pose_backend: rtmpose) ---
# YOLO chỉ đóng vai trò detector + tracker (ByteTrack). RTMPose-m chạy qua
# ONNX Runtime nhận crop của từng người và trả keypoint COCO17.
pose_backend_kwargs:
  # --- Detector / tracker (YOLO + ByteTrack) ---
  yolo_weights: "yolo11n.pt"    # hoặc yolov8n-pose.pt — chỉ dùng để detect bbox
  yolo_conf: 0.6
  yolo_imgsz: 640
  yolo_device: "cuda:0"              # "cpu" nếu không có GPU
  tracker_yaml: "bytetrack.yaml"     # built-in của ultralytics

  # --- RTMPose-m ONNX ---
  rtmpose_onnx: "weights/rtmpose-m.onnx"
  rtmpose_device: "cuda"             # "cuda" hoặc "cpu"
  rtmpose_bbox_pad: 0.10             # nới bbox 10% trước khi crop

# Nếu dùng backend khác, khai báo riêng để không đụng khối trên:
# pose_backend_kwargs_mediapipe:
#   model_complexity: 1
#   min_det_conf: 0.5

# FPS mặc định nếu không đọc được từ metadata video.
fallback_fps: 30.0

# Ngưỡng confidence tối thiểu để 1 keypoint được coi là "thấy được".
min_keypoint_confidence: 0.35

# Thư mục chứa file cấu hình từng môn.
sport_config_dir: config/sport_configs

# Thư mục lưu ReferenceModel đã xây từ dữ liệu HLV.
reference_model_dir: data/reference_models

# Ngưỡng report card.
feedback_thresholds:
  good: 85.0
  warn: 60.0

# Dung sai cho robustness_eval.py.
robustness_drift_tolerance: 15.0
    "shoulder_forward_norm:high":   "Tham khảo: vai nhô quá nhiều, dễ mất cân bằng."
    "trunk_thigh_angle:low":        "Tham khảo: góc thân–đùi trước quá nhỏ (chưa có chuẩn xác lập)."
    "trunk_thigh_angle:high":       "Tham khảo: góc thân–đùi trước quá lớn."

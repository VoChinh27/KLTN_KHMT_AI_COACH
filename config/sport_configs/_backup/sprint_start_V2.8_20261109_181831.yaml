    "trunk_thigh_angle:high": "Tham khảo: góc thân–đùi trước lớn (chưa có chuẩn xác lập)."
  static:
    "knee_front_angle:low":         "Góc gối trước gập quá sâu (<100°); nâng hông/thân lên nhẹ."
    "knee_front_angle:high":        "Góc gối trước mở quá (>135°); hạ hông xuống, gập gối trước sâu hơn."

    "contact_position_convergence:low": "Vị trí tiếp đất chưa hội tụ."
    "contact_position_convergence:high": "Vị trí tiếp đất hội tụ quá mức."
    "trunk_angle_vertical_trend:low":   "Thân chưa dựng thẳng dần đủ."
    "trunk_angle_vertical_trend:high":  "Thân dựng quá nhanh."

# ==================================================================
# FIXED REFERENCE RANGES — V3.0 (hiệu chuẩn theo HLV)
# Cột "HLV" = số liệu 15 clip thường: [min – P10 / trung vị / P90 – max]
# ==================================================================
fixed_reference_ranges:
  vao_cho:
    # HLV (20 clip đo được): 28–34 / 47 / 60–68. Giáo trình [60,95] (có bàn đạp) làm 17/20 HLV
    # bị đánh lỗi; dữ liệu nhất quán ở cả clip thường lẫn thấp -> đặc thù giao thức không bàn đạp.
    # CẦN HLV duyệt: kiểm tra bằng mắt 3 clip (HLV03, HLV04, HLV06) tại cửa sổ pha vao_cho.
    - {feature_key: knee_front_angle, min: 30.0, max: 65.0, unit: "°",
       source_note: "P5–P95 HLV 31–64°; gối trước giao thức không bàn đạp (giáo trình có bàn đạp 60–95° không phù hợp)"}
    - {feature_key: knee_back_angle,  min: 30.0, max: 65.0, unit: "°",
       source_note: "P5–P95 HLV 32–63°; V2.8 [60,100] chỉ 2/19 HLV đạt"}
    # HLV: 0.26 (ngoại lệ, che khuất) – 0.60 / 0.80 / 1.02 – 1.06. Giáo trình: tay rộng bằng vai (=1.0).
    - {feature_key: wrist_width_ratio, min: 0.60, max: 1.20, unit: ratio,
       source_note: "Giáo trình ~1.0 (bằng vai); cận dưới theo HLV (nhìn ngang bị co ngắn); V2.8 cận trên 1.80 quá rộng"}
    - {feature_key: elbow_left,  min: 155.0, max: 180.0, unit: "°",
       source_note: "Tay thẳng; HLV 160–179°"}
    - {feature_key: elbow_right, min: 155.0, max: 180.0, unit: "°",
       source_note: "Tay thẳng; HLV 155–179°"}
    - {feature_key: head_trunk_alignment, min: 100.0, max: 170.0, unit: "°",
       source_note: "HLV 97–172°, trung vị 136° — giữ nguyên V2.8"}
    # trunk_thigh_angle: BỎ khỏi chấm điểm — HLV 34–133° (SD 24°), không cụm, không chuẩn.

  static:
    # HLV (15 clip thường): 98.8 – 106 / 112 / 133 – 134.6. Clip thấp (015–022) trung vị 147° -> loại khỏi chuẩn.
    - {feature_key: knee_front_angle,        min: 100.0, max: 135.0, unit: "°",
       source_note: "Giao thức không bàn đạp: P10–P90 HLV 106–133°, trung vị 112°. Giáo trình [85,95] chỉ khi có bàn đạp."}
    # HLV (15 clip thường): 96.6 – 103 / 113 / 128 – 155.6 (155.6 = HLV013, cờ rear_ankle_low_confidence).
    # V2.8 [120,140] chỉ 6/23 HLV đạt -> chuẩn có bàn đạp không áp dụng cho giao thức này.
    - {feature_key: knee_back_angle,         min: 100.0, max: 135.0, unit: "°",
       source_note: "P10–P90 HLV 103–128°, trung vị 113°; cận trên giữ theo giáo trình (135–140°)"}
    # HLV: 0.08 – 0.15 / 0.31 / 0.42 – 0.48. Giáo trình 10–20cm (body_scale~45cm) = 0.22–0.44.
    - {feature_key: hip_above_shoulder_norm, min: 0.15,  max: 0.45,  unit: ratio,
       source_note: "P10–P90 HLV 0.15–0.42; cận trên theo giáo trình 20cm (~0.44); V2.8 cận dưới 0.22 loại nhầm 7/23 HLV"}
    - {feature_key: elbow_left,              min: 155.0, max: 180.0, unit: "°",
       source_note: "Tay thẳng; HLV 155–179°"}
    - {feature_key: elbow_right,             min: 155.0, max: 180.0, unit: "°",
       source_note: "Tay thẳng; HLV 156–178°"}

  sprint_start:
    # HLV (23 clip): 41 – 42 / 78 / 104 – 108. Giá trị ~105–108° = vẫn đang ở tư thế sẵn sàng
    # (hông cao hơn vai) -> mốc "bật" HLV011/013/014 có thể bị gán SỚM. Giáo trình [35,65] làm 65% HLV rớt.
    # TẠM THỜI lấy dải HLV; siết lại về ~[40,75] sau khi sửa mốc launch.
    - {feature_key: at_trunk_angle_vertical, min: 40.0, max: 95.0, unit: "°",
       source_note: "Dải HLV 41–98° (loại 3 clip nghi gán mốc sớm); giáo trình 35–65° chưa đo đúng thời điểm"}
    # HLV: 5 – 17 / 39 / 59 – 62. Ba giá trị thấp nhất: HLV10 (5°), HLV012 (13°), HLV09 (15°).
    - {feature_key: leg_ground_angle,        min: 20.0,  max: 65.0,  unit: "°",
       source_note: "P10–P90 HLV 17–59°; hạ cận dưới 25 -> 20"}
    # HLV: 55 – 83 / 109 / 146 – 178 (2 clip NaN).
    - {feature_key: at_knee_front_angle,     min: 80.0,  max: 180.0, unit: "°",
       source_note: "P10 HLV 83°; cận trên 180 = không giới hạn"}
    # BỎ khỏi chấm điểm (INFO), lý do bằng số liệu HLV:
    #   front_leg_full_extension: HLV đạt 4/21 (19%) — đo tại frame gia tốc cực đại, trong khi chân
    #       duỗi hết xảy ra SAU đó -> cần đo max góc gối trong cửa sổ đạp (sửa code).
    #   rear_leg_leaves_first:    thiếu dữ liệu 15/23 (65%); 8 clip đo được: 4 đạt/4 không.
    #   arm_leg_opposition:       thiếu 9/23 (39%); HLV đạt 9/14 (64%).
    #   first_step_timing:        thiếu 14/23 (61%) do fps thấp (<60); HLV -6…+2, ngoại lệ +18 frame.

  drive_phase:   # GIỮ NGUYÊN V2.8 — n<=6 clip có số liệu, trọng số pha = 0
    # Cần rà soát: step_length_trend của HLV âm (-0.84…-0.20; kỳ vọng dương), contact_position_convergence
    # luôn = 0.00 (nghi giá trị mặc định/lỗi tính), cadence_trend 2/3 clip ngoài khoảng.
    - {feature_key: step_length_trend,            min: -1.00, max: 1.00, unit: slope}
    - {feature_key: cadence_trend,                min: -1.00, max: 1.00, unit: slope}
    - {feature_key: contact_position_convergence, min: -1.00, max: 1.00, unit: slope}
    - {feature_key: trunk_angle_vertical_trend,   min: -15.0, max: 10.0, unit: deg/step}

# ==================================================================
# QUALITY GATES & TOLERANCE — V3.0
# ==================================================================
quality_gates:
  min_fps_for_temporal:              30.0
  low_resolution_shoulder_width_px:  50.0
  max_nan_ratio_per_subphase:        0.25
  low_conf_ratio_threshold:          0.35
  wrist_conf_min:                    0.40
  knee_back_conf_min:                0.40
  rear_ankle_conf_min:               0.30

tolerance:
  default: 12.0
  overrides:
    # vao_cho / static
    knee_front_angle:             12.0
    knee_back_angle:              12.0
    hip_above_shoulder_norm:      0.12
    wrist_width_ratio:            0.25
    elbow_left:                   10.0
    elbow_right:                  10.0
    head_trunk_alignment:         20.0
    # sprint_start
    at_trunk_angle_vertical:      15.0
    leg_ground_angle:             15.0
    at_knee_front_angle:          25.0
    first_step_timing:            5.0
    # drive_phase (giữ V2.8)
    step_length_trend:            0.5
    cadence_trend:                0.5
    contact_position_convergence: 0.5
    trunk_angle_vertical_trend:   3.0

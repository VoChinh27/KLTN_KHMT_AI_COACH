# config/sport_configs/sprint_start.yaml
# ==================================================================
# V3.0 (2026-11-09) — HIỆU CHUẨN THEO DỮ LIỆU HLV (23 clip) — GIAO THỨC KHÔNG BÀN ĐẠP
# Kế thừa V2.8. NGUỒN HIỆU CHUẨN: kết quả app_demo.py trên 23 clip HLV (HLV01–HLV023).
#
# PHƯƠNG PHÁP (áp dụng thống nhất cho mọi đặc trưng):
#   1. min/max  = dải P10–P90 của HLV, làm tròn ra ngoài về bội số 5° (hoặc 0.05),
#                 đối chiếu với chuẩn giáo trình; khi hai nguồn mâu thuẫn do giao
#                 thức KHÔNG bàn đạp thì ưu tiên dữ liệu HLV (ghi rõ trong source_note).
#   2. tolerance = sai số đo 2D của pose (~8–12°) cộng độ phân tán thực của HLV.
#                 Công thức chấm của app (đã kiểm chứng khớp 22/23 điểm tổng):
#                     điểm = 100 * exp(-d² / (2*tol²)),  d = khoảng cách ra ngoài [min,max]
#   3. Dữ liệu chuẩn lấy từ 15 clip độ phân giải thường (HLV01–HLV10, 011–014, 023).
#      8 clip độ phân giải thấp (HLV015–HLV022, cờ low_resolution) KHÔNG dùng để
#      định nghĩa chuẩn vì lệch hệ thống: gối trước/sau ở pha static có trung vị
#      147°/154° so với 112°/113° ở clip thường -> nghi nhiễu pose, không phải kỹ thuật.
#   4. Điều kiện để một chỉ số được CHẤM ĐIỂM (PRIMARY/SECONDARY):
#         - tỉ lệ thiếu dữ liệu (NaN) <= 25%  (khớp quality_gates.max_nan_ratio_per_subphase)
#         - HLV đạt >= 75% sau hiệu chuẩn (nếu HLV tự rớt nhiều -> lỗi ngưỡng/đo, không phải lỗi HLV)
#         - độ phân tán HLV đủ hẹp để phân biệt đúng/sai
#      Chỉ số không đạt -> chuyển INFO (chỉ hiển thị tham khảo). Khôi phục khi đã sửa nguyên nhân.
#   5. LƯU Ý: PRIMARY thiếu dữ liệu bị chấm 0 điểm (SECONDARY thì bị bỏ qua) -> chỉ số có
#      NaN > 25% KHÔNG được để PRIMARY (đã hạ wrist_width_ratio xuống SECONDARY).
#
# GIỚI HẠN CẦN GHI NHẬN: n=23 (15 clip đáng tin) và hiệu chuẩn trên chính tập đã dùng để
# đo => tỉ lệ HLV đạt bị lạc quan. Cần HLV chính duyệt thủ công + kiểm định trên clip mới.
# ==================================================================

sport: sprint_start

phases:
  - vao_cho
  - static
  - sprint_start
  - drive_phase

cyclic:
  vao_cho: false
  static: false
  sprint_start: false
  drive_phase: false

technique_phases:
  vao_cho: {ten_day_du: "Vào chỗ", engine_phase: vao_cho, order: 1, status: "active"}
  san_sang: {ten_day_du: "Sẵn sàng", engine_phase: static, order: 2, status: "active"}
  boc_phat: {ten_day_du: "Bộc phát", engine_phase: sprint_start, order: 3, status: "active"}
  chay_lao: {ten_day_du: "Chạy lao", engine_phase: drive_phase, order: 4, status: "active"}

phase_weights:
  vao_cho: 0.30
  static: 0.40
  sprint_start: 0.30
  drive_phase: 0.00   # chỉ tham khảo — bị mất người khỏi khung hình

level_weights:
  PRIMARY: 1.0
  SECONDARY: 0.5
  INFO: 0.0

feature_weights:
  vao_cho:
    knee_front_angle: 1.0
    knee_back_angle: 1.0
    wrist_width_ratio: 0.5          # V3.0: hạ từ 1.0 (thiếu dữ liệu 39%)
    elbow_left: 0.5
    elbow_right: 0.5
    head_trunk_alignment: 0.5
    # trunk_thigh_angle: V3.0 -> INFO (HLV phân tán 34–133°, không có chuẩn)
  static:
    knee_front_angle: 1.0
    knee_back_angle: 1.0
    hip_above_shoulder_norm: 1.0
    elbow_left: 0.5
    elbow_right: 0.5
  sprint_start:
    at_trunk_angle_vertical: 1.0
    leg_ground_angle: 1.0
    at_knee_front_angle: 0.5
    # V3.0 -> INFO: front_leg_full_extension, rear_leg_leaves_first,
    #               arm_leg_opposition, first_step_timing (xem feature_specs)
  drive_phase:
    step_length_trend: 0.5
    cadence_trend: 0.5
    contact_position_convergence: 0.5
    trunk_angle_vertical_trend: 0.5

capture:
  subject_height_ratio_min: 0.45
  subject_height_ratio_max: 0.75
  max_trunk_tilt_deg: 15.0

reference_method: fixed

feature_specs:
  vao_cho:
    knee_front_angle:      {level: PRIMARY,   scoring_type: range, unit: "°"}
    knee_back_angle:       {level: PRIMARY,   scoring_type: range, unit: "°"}
    wrist_width_ratio:     {level: SECONDARY, scoring_type: range, unit: ratio}   # V3.0: PRIMARY -> SECONDARY
    elbow_left:            {level: SECONDARY, scoring_type: range, unit: "°"}
    elbow_right:           {level: SECONDARY, scoring_type: range, unit: "°"}
    head_trunk_alignment:  {level: SECONDARY, scoring_type: range, unit: "°"}
    trunk_thigh_angle:     {level: INFO,      scoring_type: info,  unit: "°"}     # V3.0: PRIMARY -> INFO
    com_support_region:    {level: INFO,      scoring_type: info,  unit: bool}
  static:
    knee_front_angle:        {level: PRIMARY,   scoring_type: range, unit: "°"}
    knee_back_angle:         {level: PRIMARY,   scoring_type: range, unit: "°"}
    hip_above_shoulder_norm: {level: PRIMARY,   scoring_type: range, unit: ratio}
    elbow_left:              {level: SECONDARY, scoring_type: range, unit: "°"}
    elbow_right:             {level: SECONDARY, scoring_type: range, unit: "°"}
    shoulder_forward_norm:   {level: INFO,      scoring_type: info,  unit: ratio}
    trunk_thigh_angle:       {level: INFO,      scoring_type: info,  unit: "°"}
  sprint_start:
    at_trunk_angle_vertical:  {level: PRIMARY,   scoring_type: range, unit: "°"}
    leg_ground_angle:         {level: PRIMARY,   scoring_type: range, unit: "°"}
    at_knee_front_angle:      {level: SECONDARY, scoring_type: range, unit: "°"}
    # V3.0 -> INFO (xem lý do ở khối fixed_reference_ranges):
    front_leg_full_extension: {level: INFO, scoring_type: info, unit: bool}
    rear_leg_leaves_first:    {level: INFO, scoring_type: info, unit: bool}
    arm_leg_opposition:       {level: INFO, scoring_type: info, unit: bool}
    first_step_timing:        {level: INFO, scoring_type: info, unit: frame, fps_reference: 60}
  drive_phase:
    step_length_trend:            {level: SECONDARY, scoring_type: slope, unit: slope}
    cadence_trend:                {level: SECONDARY, scoring_type: slope, unit: slope}
    contact_position_convergence: {level: SECONDARY, scoring_type: slope, unit: slope}
    trunk_angle_vertical_trend:   {level: SECONDARY, scoring_type: slope, unit: deg/step}

